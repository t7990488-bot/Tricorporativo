<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo TRI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- FOOTER CORPORATIVO -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-400">
        &copy; 2026 TRI Corporativo. Todos los derechos reservados. Sincronización Cloud Activa.
    </footer>

    <!-- SDKs de Firebase (Modular v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js";

        // =========================================================================
        // CONFIGURACIÓN DE FIREBASE
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDbmhfVV3PMRmwcUizHv1ym9YadCrvMqcM",
            authDomain: "tri-portal-corporativo.firebaseapp.com",
            projectId: "tri-portal-corporativo",
            storageBucket: "tri-portal-corporativo.firebasestorage.app",
            messagingSenderId: "1024565321154",
            appId: "1:1024565321154:web:e951d889a1666111460a5b",
            measurementId: "G-TQZGBWYZ40"
        };

        // Inicializar Firebase
        let appFB, db, storage, analytics;
        try {
            appFB = initializeApp(firebaseConfig);
            db = getFirestore(appFB);
            storage = getStorage(appFB);
            analytics = getAnalytics(appFB);
            console.log("Firebase conectado correctamente.");
        } catch (e) {
            console.warn("Firebase no configurado o en modo offline local.", e);
        }

        // Estado Global de la Aplicación
        window.AppState = {
            currentUser: null, // { username, role, name, email, vehicle, art, payslips, avatar }
            view: 'login',     // 'login', 'admin_dashboard', 'employee_portal'
            employees: [],     // Lista desde Firestore
            async init() {
                await this.loadData();
                renderApp();
            },
            async loadData() {
                if (db) {
                    try {
                        const querySnapshot = await getDocs(collection(db, "employees"));
                        this.employees = [];
                        querySnapshot.forEach((docSnap) => {
                            this.employees.push(docSnap.data());
                        });
                    } catch (err) {
                        console.error("Error cargando de Firestore:", err);
                    }
                }
                if (this.employees.length === 0) {
                    this.employees = [];
                }
            },
            async saveEmployeeToCloud(emp) {
                if (db) {
                    try {
                        await setDoc(doc(db, "employees", emp.username), emp);
                    } catch (e) {
                        console.error("Error al guardar en Firestore", e);
                    }
                }
            },
            async removeEmployeeFromCloud(username) {
                if (db) {
                    try {
                        await deleteDoc(doc(db, "employees", username));
                    } catch (e) {
                        console.error("Error al eliminar en Firestore", e);
                    }
                }
            }
        };

        // --- ENRUTADOR Y RENDERIZADOR PRINCIPAL ---
        window.renderApp = function() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = '';

            if (window.AppState.view === 'login') {
                appDiv.innerHTML = renderLoginScreen();
            } else if (window.AppState.view === 'admin_dashboard') {
                appDiv.innerHTML = renderAdminDashboard();
            } else if (window.AppState.view === 'employee_portal') {
                appDiv.innerHTML = renderEmployeePortal();
            }
        }

        // --- PANTALLA DE LOGIN ---
        function renderLoginScreen() {
            return `
                <div class="flex-grow flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/10 text-blue-500 mb-4 border border-blue-500/20">
                                <i class="fa-solid fa-shield-halved text-3xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">TRI Corporativo</h1>
                            <p class="text-xs text-slate-400 mt-1">Portal de Gestión y Legajos Viales</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Usuario</label>
                                <input type="text" id="loginUser" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600 transition" placeholder="Ingrese su usuario">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña</label>
                                <input type="password" id="loginPass" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600 transition" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-blue-600/20 text-sm mt-2">
                                Ingresar al Sistema
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            if (u === 'admintri' && p === 'Tri912125') {
                window.AppState.currentUser = { username: 'admintri', role: 'admin', name: 'Administrador General' };
                window.AppState.view = 'admin_dashboard';
                renderApp();
                return;
            }

            const found = window.AppState.employees.find(emp => emp.username === u && emp.password === p);
            if (found) {
                window.AppState.currentUser = found;
                window.AppState.view = 'employee_portal';
                renderApp();
                return;
            }

            alert('Credenciales incorrectas o usuario no registrado.');
        }

        window.logout = function() {
            window.AppState.currentUser = null;
            window.AppState.view = 'login';
            renderApp();
        }

        // --- PANEL DE ADMINISTRADOR ---
        function renderAdminDashboard() {
            const emps = window.AppState.employees;
            return `
                <div class="flex flex-col md:flex-row flex-grow">
                    <!-- Sidebar Admin -->
                    <aside class="w-full md:w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center space-x-3 mb-8">
                                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold">TRI</div>
                                <div>
                                    <h2 class="text-sm font-bold text-white">Panel Admin</h2>
                                    <p class="text-xs text-slate-400">admintri</p>
                                </div>
                            </div>
                            <nav class="space-y-1">
                                <button class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-blue-600/10 text-blue-500 font-medium text-sm">
                                    <i class="fa-solid fa-users text-base"></i><span>Gestión de Empleados</span>
                                </button>
                            </nav>
                        </div>
                        <button onclick="logout()" class="mt-6 w-full flex items-center justify-center space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-medium transition">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Cerrar Sesión</span>
                        </button>
                    </aside>

                    <!-- Main Content Admin -->
                    <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
                            <div>
                                <h1 class="text-xl md:text-2xl font-bold text-white">Legajos y Personal</h1>
                                <p class="text-xs md:text-sm text-slate-400">Administre credenciales, seguros vehiculares, ART y recibos.</p>
                            </div>
                            <button onclick="openNewEmployeeModal()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-user-plus"></i><span>Nuevo Empleado</span>
                            </button>
                        </div>

                        <!-- Tarjetas de Empleados -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${emps.length === 0 ? `
                                <div class="col-span-full py-16 text-center border border-dashed border-slate-800 rounded-2xl">
                                    <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3"></i>
                                    <p class="text-sm text-slate-400">No hay empleados registrados en la base de datos.</p>
                                    <p class="text-xs text-slate-600 mt-1">Haga clic en "Nuevo Empleado" para comenzar.</p>
                                </div>
                            ` : emps.map(emp => `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center space-x-4 mb-4">
                                            <img src="${emp.avatar || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full object-cover border border-slate-700">
                                            <div>
                                                <h3 class="font-semibold text-sm text-white">${emp.name}</h3>
                                                <p class="text-xs text-slate-400">Usuario: @${emp.username}</p>
                                            </div>
                                        </div>
                                        <div class="space-y-2 text-xs text-slate-300 border-t border-slate-800 pt-3">
                                            <p><i class="fa-solid fa-car text-blue-500 w-5"></i> Vehículo: ${emp.vehicle?.model || 'No asignado'} (${emp.vehicle?.plate || 'S/D'})</p>
                                            <p><i class="fa-solid fa-file-shield text-emerald-500 w-5"></i> ART: ${emp.art ? 'Cargada' : 'Pendiente'}</p>
                                            <p><i class="fa-solid fa-file-invoice-dollar text-amber-500 w-5"></i> Recibos: ${emp.payslips?.length || 0} cargados</p>
                                        </div>
                                    </div>
                                    <div class="mt-6 flex items-center space-x-2 border-t border-slate-800 pt-3">
                                        <button onclick="openEditEmployeeModal('${emp.username}')" class="flex-grow bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl text-xs font-medium transition text-center">
                                            Editar Legajo
                                        </button>
                                        <button onclick="deleteEmployee('${emp.username}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-3 py-2 rounded-xl text-xs transition">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </main>
                </div>
                <div id="modalContainer"></div>
            `;
        }

        // --- PORTAL DEL EMPLEADO ---
        function renderEmployeePortal() {
            const emp = window.AppState.currentUser;
            return `
                <div class="flex-grow max-w-4xl mx-auto p-4 md:p-8 w-full flex flex-col justify-between">
                    <div>
                        <!-- Header Empleado -->
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div class="flex items-center space-x-4">
                                <img src="${emp.avatar || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-full object-cover border-2 border-blue-600">
                                <div class="text-center sm:text-left">
                                    <h1 class="text-lg font-bold text-white">${emp.name}</h1>
                                    <p class="text-xs text-slate-400">Legajo Personal • Acceso Restringido</p>
                                </div>
                            </div>
                            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-medium transition">
                                <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Salir
                            </button>
                        </div>

                        <!-- Secciones de Información -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Recibos de Sueldo -->
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                <h2 class="text-sm font-bold text-white mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-file-invoice-dollar text-blue-500"></i>
                                    <span>Mis Recibos de Sueldo</span>
                                </h2>
                                <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                    ${!emp.payslips || emp.payslips.length === 0 ? '<p class="text-xs text-slate-500">No hay recibos cargados.</p>' : emp.payslips.map(p => `
                                        <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800/60">
                                            <div>
                                                <p class="text-xs font-semibold text-white">${p.period}</p>
                                                <p class="text-[10px] text-slate-500">${p.date || ''}</p>
                                            </div>
                                            <a href="${p.url}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs transition">
                                                <i class="fa-solid fa-download"></i>
                                            </a>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Seguro Vehicular y ART -->
                            <div class="space-y-6">
                                <!-- Vehículo -->
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h2 class="text-sm font-bold text-white mb-4 flex items-center space-x-2">
                                        <i class="fa-solid fa-car text-blue-500"></i>
                                        <span>Seguro de Vehículo Asignado</span>
                                    </h2>
                                    ${!emp.vehicle?.plate ? '<p class="text-xs text-slate-500">Sin vehículo asignado actualmente.</p>' : `
                                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/60 space-y-2 text-xs">
                                            <p class="text-white font-semibold">${emp.vehicle.model} - Patente: <span class="text-blue-400">${emp.vehicle.plate}</span></p>
                                            <p class="text-slate-400">Aseguradora: ${emp.vehicle.insurance}</p>
                                            <p class="text-slate-400">Póliza N°: ${emp.vehicle.policy}</p>
                                            ${emp.vehicle.url ? `<a href="${emp.vehicle.url}" target="_blank" class="inline-block mt-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-file-pdf mr-1"></i> Descargar Póliza</a>` : ''}
                                        </div>
                                    `}
                                </div>

                                <!-- ART -->
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h2 class="text-sm font-bold text-white mb-4 flex items-center space-x-2">
                                        <i class="fa-solid fa-file-shield text-emerald-500"></i>
                                        <span>Credencial / Seguro ART</span>
                                    </h2>
                                    ${!emp.art?.company ? '<p class="text-xs text-slate-500">Sin cobertura ART registrada.</p>' : `
                                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/60 space-y-2 text-xs">
                                            <p class="text-white font-semibold">Aseguradora: ${emp.art.company}</p>
                                            <p class="text-slate-400">Contrato N°: ${emp.art.contract}</p>
                                            ${emp.art.url ? `<a href="${emp.art.url}" target="_blank" class="inline-block mt-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 px-3 py-1.5 rounded-lg transition border border-emerald-500/35"><i class="fa-solid fa-download mr-1"></i> Descargar Certificado ART</a>` : ''}
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- MODAL CREAR / EDITAR EMPLEADO (ADMIN) ---
        window.openNewEmployeeModal = function() {
            showEmployeeModal({ username: '', name: '', password: '', avatar: '', vehicle: {}, art: {}, payslips: [] }, true);
        }

        window.openEditEmployeeModal = function(username) {
            const emp = window.AppState.employees.find(e => e.username === username);
            if (emp) showEmployeeModal(emp, false);
        }

        function showEmployeeModal(emp, isNew) {
            const modalHTML = `
                <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-base font-bold text-white">${isNew ? 'Registrar Nuevo Empleado' : 'Editar Legajo: ' + emp.name}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form id="empForm" onsubmit="saveEmployee(event, '${emp.username}', ${isNew})" class="space-y-4 text-xs">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-medium text-slate-300 mb-1">Nombre Completo</label>
                                    <input type="text" id="mName" value="${emp.name || ''}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-600">
                                </div>
                                <div>
                                    <label class="block font-medium text-slate-300 mb-1">Usuario de Acceso</label>
                                    <input type="text" id="mUser" value="${emp.username || ''}" ${!isNew ? 'readonly' : ''} required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-600 ${!isNew ? 'opacity-60 cursor-not-allowed' : ''}">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-medium text-slate-300 mb-1">Contraseña</label>
                                    <input type="text" id="mPass" value="${emp.password || ''}" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-600">
                                </div>
                                <div>
                                    <label class="block font-medium text-slate-300 mb-1">Foto de Perfil (URL o Archivo)</label>
                                    <input type="text" id="mAvatar" value="${emp.avatar || ''}" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-600">
                                </div>
                            </div>

                            <hr class="border-slate-800 my-4">
                            <h4 class="font-bold text-white text-sm">Seguro de Vehículo</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <input type="text" id="vModel" placeholder="Modelo Vehículo" value="${emp.vehicle?.model || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                                <input type="text" id="vPlate" placeholder="Patente" value="${emp.vehicle?.plate || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                                <input type="text" id="vIns" placeholder="Aseguradora" value="${emp.vehicle?.insurance || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input type="text" id="vPolicy" placeholder="Número de Póliza" value="${emp.vehicle?.policy || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                                <input type="text" id="vUrl" placeholder="Link PDF Póliza" value="${emp.vehicle?.url || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                            </div>

                            <hr class="border-slate-800 my-4">
                            <h4 class="font-bold text-white text-sm">Seguro ART</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <input type="text" id="artComp" placeholder="Compañía ART" value="${emp.art?.company || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                                <input type="text" id="artCont" placeholder="N° Contrato" value="${emp.art?.contract || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                                <input type="text" id="artUrl" placeholder="Link PDF Certificado" value="${emp.art?.url || ''}" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                            </div>

                            <hr class="border-slate-800 my-4">
                            <h4 class="font-bold text-white text-sm">Recibos de Sueldo (Periodo y Link PDF)</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input type="text" id="payPeriod" placeholder="Ej: Octubre 2026" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                                <input type="text" id="payUrl" placeholder="Link PDF del Recibo" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                            </div>

                            <div class="pt-4 flex justify-end space-x-2">
                                <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl">Cancelar</button>
                                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl font-medium">Guardar Legajo</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').innerHTML = modalHTML;
        }

        window.closeModal = function() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        window.saveEmployee = async function(e, oldUsername, isNew) {
            e.preventDefault();
            const username = document.getElementById('mUser').value.trim();
            const name = document.getElementById('mName').value.trim();
            const password = document.getElementById('mPass').value.trim();
            const avatar = document.getElementById('mAvatar').value.trim();

            const vehicle = {
                model: document.getElementById('vModel').value.trim(),
                plate: document.getElementById('vPlate').value.trim(),
                insurance: document.getElementById('vIns').value.trim(),
                policy: document.getElementById('vPolicy').value.trim(),
                url: document.getElementById('vUrl').value.trim()
            };

            const art = {
                company: document.getElementById('artComp').value.trim(),
                contract: document.getElementById('artCont').value.trim(),
                url: document.getElementById('artUrl').value.trim()
            };

            let existingEmp = window.AppState.employees.find(x => x.username === (isNew ? username : oldUsername));
            let payslips = existingEmp ? (existingEmp.payslips || []) : [];

            const pPeriod = document.getElementById('payPeriod').value.trim();
            const pUrl = document.getElementById('payUrl').value.trim();
            if (pPeriod && pUrl) {
                payslips.push({ period: pPeriod, url: pUrl, date: new Date().toLocaleDateString() });
            }

            const empObj = { username, name, password, avatar, vehicle, art, payslips };

            if (isNew) {
                if (window.AppState.employees.some(x => x.username === username)) {
                    alert('El nombre de usuario ya existe.');
                    return;
                }
                window.AppState.employees.push(empObj);
            } else {
                if (oldUsername !== username) {
                    await window.AppState.removeEmployeeFromCloud(oldUsername);
                    window.AppState.employees = window.AppState.employees.filter(x => x.username !== oldUsername);
                }
                window.AppState.employees = window.AppState.employees.map(x => x.username === username ? empObj : x);
            }

            await window.AppState.saveEmployeeToCloud(empObj);
            closeModal();
            renderApp();
        }

        window.deleteEmployee = async function(username) {
            if (confirm(`¿Está seguro de eliminar al empleado @${username}?`)) {
                await window.AppState.removeEmployeeFromCloud(username);
                window.AppState.employees = window.AppState.employees.filter(x => x.username !== username);
                renderApp();
            }
        }

        // Iniciar aplicación
        window.AppState.init();
    </script>
</body>
</html>
