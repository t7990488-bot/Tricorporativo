<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo TRI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- FOOTER CORPORATIVO -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-400">
        &copy; 2026 TRI Corporativo. Todos los derechos reservados. Sincronización Cloud Activa.
    </footer>

    <!-- SDKs de Firebase (Modular v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js";

        // =========================================================================
        // CONFIGURACIÓN DE FIREBASE
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDbmhfVV3PMRmwcUizHv1ym9YadCrvMqcM",
            authDomain: "tri-portal-corporativo.firebaseapp.com",
            projectId: "tri-portal-corporativo",
            storageBucket: "tri-portal-corporativo.firebasestorage.app",
            messagingSenderId: "1024565321154",
            appId: "1:1024565321154:web:e951d889a1666111460a5b",
            measurementId: "G-TQZGBWYZ40"
        };

        // Inicializar Firebase
        let appFB, db, storage, analytics;
        try {
            appFB = initializeApp(firebaseConfig);
            db = getFirestore(appFB);
            storage = getStorage(appFB);
            analytics = getAnalytics(appFB);
            console.log("Firebase conectado correctamente.");
        } catch (e) {
            console.warn("Firebase no configurado o en modo offline local.", e);
        }

        // Estado Global de la Aplicación
        window.AppState = {
            currentUser: null,
            view: 'login',
            employees: [],
            async init() {
                await this.loadData();
                renderApp();
            },
            async loadData() {
                if (db) {
                    try {
                        const querySnapshot = await getDocs(collection(db, "employees"));
                        this.employees = [];
                        querySnapshot.forEach((docSnap) => {
                            this.employees.push(docSnap.data());
                        });
                    } catch (err) {
                        console.error("Error cargando de Firestore:", err);
                    }
                }
                if (this.employees.length === 0) {
                    this.employees = [];
                }
            },
            async saveEmployeeToCloud(emp) {
                if (db) {
                    try {
                        await setDoc(doc(db, "employees", emp.username), emp);
                    } catch (e) {
                        console.error("Error al guardar en Firestore", e);
                    }
                }
            },
            async removeEmployeeFromCloud(username) {
                if (db) {
                    try {
                        await deleteDoc(doc(db, "employees", username));
                    } catch (e) {
                        console.error("Error al eliminar en Firestore", e);
                    }
                }
            }
        };

        // --- ENRUTADOR Y RENDERIZADOR PRINCIPAL ---
        window.renderApp = function() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = '';

            if (window.AppState.view === 'login') {
                appDiv.innerHTML = renderLoginScreen();
            } else if (window.AppState.view === 'admin_dashboard') {
                appDiv.innerHTML = renderAdminDashboard();
            } else if (window.AppState.view === 'employee_portal') {
                appDiv.innerHTML = renderEmployeePortal();
            }
        }

        // --- PANTALLA DE LOGIN ---
        function renderLoginScreen() {
            return `
                <div class="flex-grow flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/10 text-blue-500 mb-4 border border-blue-500/20">
                                <i class="fa-solid
